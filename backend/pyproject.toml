[project]
name = "larpsec-backend"
version = "0.1.0"
description = "Evidence-backed organizational change analysis"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "python-docx>=1.1,<2",
  "pypdf>=6.0,<7",
  "openpyxl>=3.1,<4",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "reportlab>=4.3,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
