services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATA_DIR: /app/data
    volumes:
      - analysis_data:/app/data
    restart: unless-stopped

volumes:
  analysis_data:
